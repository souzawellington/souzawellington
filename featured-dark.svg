<svg xmlns="http://www.w3.org/2000/svg" width="920" height="168" viewBox="0 0 920 168" role="img" aria-label="Featured project llm-guardrails-lab" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
