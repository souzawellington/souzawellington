<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Wellington Vieira De Souza</title>
  <desc id="desc">AI security and LLM guardrails. Featured project: llm-guardrails-lab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="0.58" stop-color="#141210"/>
      <stop offset="1" stop-color="#1C1612"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="frost" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="card"><rect width="1180" height="460" rx="24"/></clipPath>
    <clipPath id="leftClip"><rect x="32" y="32" width="700" height="396" rx="18"/></clipPath>
    <clipPath id="rightClip"><rect x="752" y="32" width="396" height="396" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1180" height="460" fill="url(#bg)"/>
    <g filter="url(#frost)">
      <ellipse cx="180" cy="70" rx="240" ry="150" fill="#C8692C" opacity="0.34"/>
      <ellipse cx="1020" cy="420" rx="260" ry="160" fill="#C8692C" opacity="0.10"/>
      <ellipse cx="640" cy="230" rx="200" ry="130" fill="#3A342E" opacity="0.65"/>
    </g>
    <g clip-path="url(#leftClip)">
      <rect x="32" y="32" width="700" height="396" fill="#1C1C20" fill-opacity="0.58"/>
      <rect x="32" y="32" width="700" height="150" fill="url(#sheen)"/>
    </g>
    <rect x="32.5" y="32.5" width="699" height="395" rx="18" fill="none" stroke="#F4EFE8" stroke-opacity="0.16" stroke-width="1"/>
    <g clip-path="url(#rightClip)">
      <rect x="752" y="32" width="396" height="396" fill="#1C1C20" fill-opacity="0.58"/>
      <rect x="752" y="32" width="396" height="150" fill="url(#sheen)"/>
    </g>
    <rect x="752.5" y="32.5" width="395" height="395" rx="18" fill="none" stroke="#F4EFE8" stroke-opacity="0.16" stroke-width="1"/>
    <text x="64" y="78" font-size="13" letter-spacing="3.4" fill="#C8692C">AI SECURITY</text>
    <text x="64" y="132" font-size="34" font-weight="600" fill="#F7F5F2">Wellington Vieira De Souza</text>
    <text x="64" y="170" font-size="16" fill="#A39C94">AI security and LLM guardrails</text>
    <line x1="64" y1="206" x2="692" y2="206" stroke="#C8692C" stroke-opacity="0.7" stroke-width="1"/>
    <text x="64" y="256" font-size="18" fill="#E6E0D8">Red-teaming with Garak</text>
    <text x="64" y="290" font-size="18" fill="#E6E0D8">Protection with NeMo Guardrails</text>
    <text x="64" y="324" font-size="18" fill="#A39C94">A second scan shows what the rails changed</text>
    <text x="64" y="386" font-size="15" fill="#C8692C">@souzawellington</text>
    <text x="784" y="78" font-size="13" letter-spacing="3.4" fill="#C8692C">FEATURED LAB</text>
    <text x="784" y="128" font-size="24" font-weight="600" fill="#F7F5F2">llm-guardrails-lab</text>
    <text x="784" y="178" font-size="16" fill="#E6E0D8">Scan with Garak.</text>
    <text x="784" y="208" font-size="16" fill="#E6E0D8">Protect with NeMo Guardrails.</text>
    <text x="784" y="238" font-size="16" fill="#A39C94">Compare the two reports.</text>
    <line x1="784" y1="274" x2="1116" y2="274" stroke="#C8692C" stroke-opacity="0.7" stroke-width="1"/>
    <text x="784" y="318" font-size="13" letter-spacing="3.4" fill="#C8692C">LIVE SITE</text>
    <text x="784" y="356" font-size="15" fill="#E6E0D8">souzawellington.github.io</text>
    <text x="784" y="382" font-size="15" fill="#E6E0D8">/llm-guardrails-lab</text>
  </g>
</svg>
